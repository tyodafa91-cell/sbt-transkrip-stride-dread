[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read-write", path = "./data" }]

[fmt]
line_length = 100

[lint]
lint_on_build = false

[invariant]
runs = 128
depth = 200
fail_on_revert = false
